<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script>
    // La dirección vieja (sitio estático de Render, sin servidor) pierde los pedidos:
    // se redirige a la nueva conservando la página (QR y enlaces viejos siguen funcionando).
    if (location.hostname === "carta-freshco.onrender.com") {
      location.replace("https://carta-freshco-j7at.onrender.com" + location.pathname + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido – Freshco</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #05060c; color: #f2f6fc; font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 24px 18px 48px; max-width: 520px; margin: 0 auto; }
    .logo { width: 150px; display: block; margin: 0 auto 20px; }
    .titulo { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: .06em; color: #fff; }
    .sub { text-align: center; color: #9aa6bb; font-size: 13px; margin: 4px 0 22px; }
    .tarjeta { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 16px 18px; margin-bottom: 14px; }
    .modo { text-align: center; margin-bottom: 10px; }
    .badge { display: inline-block; padding: 5px 16px; border-radius: 999px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; }
    .badge-local { background: rgba(164,91,255,.2); border: 1px solid #a45bff; color: #a45bff; }
    .badge-dom { background: rgba(37,211,102,.15); border: 1px solid #25d366; color: #25d366; }
    .fila { display: flex; gap: 10px; margin-top: 7px; font-size: 15px; }
    .fila strong { color: #7fd4ff; min-width: 90px; }
    .sec-titulo { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #9aa6bb; margin-bottom: 10px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .item:last-child { border-bottom: none; }
    .item img { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; border: 1px solid rgba(255,255,255,.12); flex-shrink: 0; }
    .item-nom { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; line-height: 1.1; }
    .item-sec { font-size: 13px; color: #9aa6bb; }
    .item-cant { margin-left: auto; background: rgba(127,212,255,.12); border: 1px solid rgba(127,212,255,.4); border-radius: 999px; padding: 4px 13px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; color: #7fd4ff; white-space: nowrap; flex-shrink: 0; }
    .total { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; text-align: right; color: #7fd4ff; padding-top: 12px; }
    .error { text-align: center; padding: 60px 20px; color: #9aa6bb; font-size: 15px; }
    .estado { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; text-transform: uppercase; color: #7fd4ff; }
    .pasos { list-style: none; display: flex; gap: 6px; margin-top: 12px; }
    .pasos li { flex: 1; text-align: center; font-size: 12px; color: #9aa6bb; padding-top: 10px; border-top: 4px solid rgba(255,255,255,.12); border-radius: 2px; }
    .pasos li.hecho { border-color: #7fd4ff; color: #f2f6fc; }
    .pasos li.actual { font-weight: 600; }
    .cancelado { margin-top: 8px; color: #ff5c6d; }
    .oculto { display: none !important; }
    .revision { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14.5px; background: rgba(255,185,46,.1); border: 1px solid rgba(255,185,46,.45); color: #ffd27a; }
    .confirmado { margin-top: 10px; font-size: 14px; color: #3ddc84; font-weight: 500; }
    .ubic { border-color: rgba(37,211,102,.45); }
    .ubic-buscando { border-color: rgba(127,212,255,.45); }
    .ubic-error { border-color: rgba(255,92,109,.55); }
    .ubic-pendiente { border-color: rgba(127,212,255,.55); background: rgba(127,212,255,.06); }
    .ubic-texto { font-size: 15px; }
    .ubic-ok .ubic-texto { color: #3ddc84; font-weight: 500; }
    .ubic-error .ubic-texto { color: #ff8a96; }
    .ubic-nota { margin-top: 6px; font-size: 13px; color: #9aa6bb; }
    .btn-ubic { margin-top: 10px; width: 100%; padding: 11px; border-radius: 12px; border: none; cursor: pointer; background: #25d366; color: #05060c; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; }
    .btn-volver { display: inline-block; margin-top: 15px; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.08); color: #fff; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; }
  </style>
</head>
<body>
<img src="img/logo.webp" alt="Freshco" class="logo">
<div id="ubic" class="oculto" aria-live="polite"></div>
<div id="root"><div class="error">Cargando pedido...</div></div>
<script src="js/data.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ESTADOS = {
  nuevo:      { txt: "Recibido",       paso: 0 },
  preparando: { txt: "En preparación", paso: 1 },
  listo:      { txt: "Listo",          paso: 2 },
  entregado:  { txt: "Entregado",      paso: 3 },
  cancelado:  { txt: "Cancelado",      paso: -1 }
};
const PASOS = ["Recibido", "Preparando", "Listo", "Entregado"];
const telBonito = d => d && d.length === 10 ? `${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6)}` : String(d || "");
const root = document.getElementById("root");
const id = new URLSearchParams(location.search).get("id");

function render(p) {
  const est = ESTADOS[p.estado] || ESTADOS.nuevo;
  const modo = p.tipo === "local"
    ? `<span class="badge badge-local">En el local – Mesa ${esc(p.mesa)}</span>`
    : `<span class="badge badge-dom">A domicilio</span>`;
  const extra = p.tipo !== "local" ? [
    p.nombre ? `<div class="fila"><strong>Cliente:</strong><span>${esc(p.nombre)}</span></div>` : "",
    p.direccion ? `<div class="fila"><strong>Dirección:</strong><span>${esc(p.direccion)}</span></div>` : "",
    p.telefono ? `<div class="fila"><strong>Celular:</strong><span>${esc(telBonito(p.telefono))}</span></div>` : ""
  ].join("") : "";
  // Domicilio recién hecho: el local revisa los datos antes de aceptarlo
  const revision = p.tipo === "domicilio" && p.estado === "nuevo" && !p.verificado
    ? `<p class="revision">Estamos revisando tus datos para confirmar el domicilio.${p.telefono ? ` Es posible que te llamemos al <b>${esc(telBonito(p.telefono))}</b>.` : ""}</p>`
    : p.tipo === "domicilio" && p.verificado && p.estado !== "cancelado" ? `<p class="confirmado">Domicilio confirmado</p>` : "";
  const progreso = est.paso < 0
    ? `<p class="cancelado">Este pedido fue cancelado.${p.motivo ? ` Motivo: ${esc(p.motivo)}` : " Pregunta en la barra si tienes dudas."}</p>`
    : `<ol class="pasos">${PASOS.map((t, i) => `<li class="${i <= est.paso ? "hecho" : ""}${i === est.paso ? " actual" : ""}">${t}</li>`).join("")}</ol>`;
  const itemsHtml = p.items.map(it => {
    const img = it.imagen ? `<img src="${esc(encodeURI(it.imagen))}" alt="${esc(it.nombre)}" loading="lazy">` : "";
    return `<div class="item">${img}<div><div class="item-nom">${esc(it.nombre)}</div><div class="item-sec">${esc(it.seccion)}${it.precio ? ` · $${Number(it.precio).toLocaleString("es-CO")} c/u` : ""}</div></div><span class="item-cant">${it.cantidad}x</span></div>`;
  }).join("");
  const total = p.total ? ` · $${Number(p.total).toLocaleString("es-CO")}` : "";

  root.innerHTML = `
    <p class="titulo">Pedido #${esc(p.numero)}</p>
    <p class="sub">${new Date(p.creado).toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" })}</p>
    <div class="tarjeta"><p class="sec-titulo">Estado</p><p class="estado">${est.txt}</p>${progreso}${revision}</div>
    <div class="tarjeta"><div class="modo">${modo}</div>${extra}</div>
    <div class="tarjeta"><p class="sec-titulo">Detalle del pedido</p>${itemsHtml}
      <p class="total">Total: ${p.unidades} ${p.unidades === 1 ? "producto" : "productos"}${total}</p>
    </div>
    ${p.notas ? `<div class="tarjeta"><p class="sec-titulo">Notas</p><p>${esc(p.notas)}</p></div>` : ""}
    <p style="text-align:center"><a href="index.html" class="btn-volver">Volver a la carta</a></p>`;
  return p.estado === "entregado" || p.estado === "cancelado";
}

function error(msg) {
  root.innerHTML = `<div class="error"><p>${esc(msg)}</p><a href="index.html" class="btn-volver">Ir a la carta</a></div>`;
}

// ---------- Ubicación en vivo (solo domicilios en curso) ----------
// El navegador solo puede enviarla mientras esta página esté abierta.
const cajaUbic = document.getElementById("ubic");
const ENVIO_CADA_MS = 15000;
let vigilancia = null, latido = null, ultimoEnvio = 0, ultimaPos = null, ubicActiva = false;

function pintarUbic(estado, texto, boton) {
  cajaUbic.className = `tarjeta ubic ubic-${estado}`;
  cajaUbic.innerHTML = `
    <p class="sec-titulo">Ubicación para el domiciliario</p>
    <p class="ubic-texto">${esc(texto)}</p>
    ${estado === "ok" ? `<p class="ubic-nota">Mantén esta página abierta hasta recibir tu pedido para que el domiciliario vea dónde estás.</p>` : ""}
    ${boton ? `<button type="button" class="btn-ubic" id="btn-ubic">${esc(boton)}</button>` : ""}`;
  const b = document.getElementById("btn-ubic");
  if (b) b.addEventListener("click", iniciarUbicacion);
}

async function enviarUbicacion(pos, forzar = false) {
  ultimaPos = pos;
  const ahora = Date.now();
  if (!forzar && ahora - ultimoEnvio < ENVIO_CADA_MS) return;
  ultimoEnvio = ahora;
  try {
    const res = await fetch(`/api/pedidos/${encodeURIComponent(id)}/ubicacion`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude, precision: pos.coords.accuracy })
    });
    if (res.status === 409) return detenerUbicacion();
    if (res.ok) {
      const hora = new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
      pintarUbic("ok", `Compartiendo tu ubicación en vivo (precisión ±${Math.round(pos.coords.accuracy)} m · ${hora})`);
    }
  } catch (e) { /* sin conexión: se reintenta con la siguiente posición */ }
}

function iniciarUbicacion() {
  if (ubicActiva) return;
  if (!("geolocation" in navigator)) return pintarUbic("error", "Tu navegador no permite compartir la ubicación.");
  ubicActiva = true;
  pintarUbic("buscando", "Activando tu ubicación…");
  // El GPS solo avisa cuando hay cambios: se reenvía la última posición cada 15 s
  // para no perder la más reciente y para que el panel la vea "en vivo".
  // (se revisa cada 3 s; enviarUbicacion respeta el mínimo de 15 s entre envíos)
  latido = setInterval(() => { if (ultimaPos) enviarUbicacion(ultimaPos); }, 3000);
  setTimeout(() => {
    if (ubicActiva && !ultimaPos) pintarUbic("buscando", "Aún buscando tu ubicación… Revisa que la ubicación (GPS) del celular esté encendida.");
  }, 20000);
  // Posición rápida (wifi/red) para empezar ya; el GPS la mejora después
  navigator.geolocation.getCurrentPosition(
    pos => { if (!ultimaPos) enviarUbicacion(pos, true); },
    () => {},
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 120000 }
  );
  vigilancia = navigator.geolocation.watchPosition(
    pos => {
      // No reemplazar una posición precisa por una mucho peor
      if (ultimaPos && pos.coords.accuracy > ultimaPos.coords.accuracy * 3 && Date.now() - ultimaPos.timestamp < 60000) return;
      enviarUbicacion(pos);
    },
    err => {
      // Sin límite de tiempo el GPS no da TIMEOUT; otros fallos pasajeros se ignoran.
      // Solo se detiene si el cliente bloquea el permiso.
      if (err.code !== err.PERMISSION_DENIED) return;
      ubicActiva = false;
      if (vigilancia != null) navigator.geolocation.clearWatch(vigilancia);
      vigilancia = null;
      clearInterval(latido);
      pintarUbic("error", `Ubicación bloqueada. ${instruccionesUbicacion()}`, "Ya la activé, intentar de nuevo");
    },
    { enableHighAccuracy: true, maximumAge: 10000 }
  );
}

// Domicilio en curso: si ya hay permiso se comparte sola; si está bloqueada se explican los
// pasos; si no, botón visible "Compartir mi ubicación en vivo" (el permiso se pide al tocarlo).
let seguimientoPreparado = false;
async function prepararSeguimiento() {
  if (ubicActiva || seguimientoPreparado) return;
  seguimientoPreparado = true;
  if (!("geolocation" in navigator)) return pintarUbic("error", "Tu navegador no permite compartir la ubicación.");
  if (enNavegadorDeApp()) return pintarUbic("error", instruccionesUbicacion(), "Intentar de todos modos");
  const estado = await estadoPermisoUbicacion();
  if (estado === "granted") return iniciarUbicacion();
  if (estado === "denied") return pintarUbic("error", `Ubicación bloqueada. ${instruccionesUbicacion()}`, "Ya la activé, intentar de nuevo");
  pintarUbic("pendiente", "Comparte tu ubicación en vivo para que el domiciliario te encuentre más rápido.", "Compartir mi ubicación en vivo");
}

function detenerUbicacion() {
  if (vigilancia != null) navigator.geolocation.clearWatch(vigilancia);
  vigilancia = null;
  clearInterval(latido);
  ubicActiva = false;
  cajaUbic.className = "oculto";
  cajaUbic.innerHTML = "";
}

// Al volver a la página (p. ej. tras bloquear el celular) se envía de inmediato
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && ubicActiva && ultimaPos) enviarUbicacion(ultimaPos, true);
});

async function cargar() {
  try {
    const res = await fetch(`/api/pedidos/${encodeURIComponent(id)}`);
    if (res.status === 404) return error("No encontramos este pedido.");
    if (!res.ok) throw new Error();
    const pedido = await res.json();
    const terminado = render(pedido);
    if (pedido.tipo === "domicilio" && !terminado) prepararSeguimiento();
    else detenerUbicacion();
    if (!terminado) setTimeout(cargar, 10000);
  } catch (e) {
    if (!root.querySelector(".titulo")) error("No se pudo cargar el pedido. Revisa tu conexión.");
    setTimeout(cargar, 15000);
  }
}

if (!id) error("No se indicó ningún pedido.");
else cargar();
</script>
</body>
</html>
