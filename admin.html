<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel Freshco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="led" aria-hidden="true"></div>

  <!-- Inicio de sesión -->
  <section id="vista-login" class="login oculto">
    <form id="form-login" class="login-caja" autocomplete="on">
      <img src="img/logo.webp" alt="Freshco" width="1000" height="641">
      <h1>Panel de pedidos</h1>
      <label><span>Usuario</span><input id="login-usuario" name="username" autocomplete="username" required></label>
      <label><span>Contraseña</span><input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="login-error" role="alert"></p>
      <button type="submit" class="btn-primario">Iniciar sesión</button>
    </form>
  </section>

  <!-- Panel -->
  <section id="vista-panel" class="panel oculto">
    <header class="panel-cabecera">
      <img src="img/logo.webp" alt="Freshco" width="1000" height="641">
      <div class="panel-titulo">
        <h1>Pedidos</h1>
        <p id="panel-estado-conexion" class="conexion">Conectando…</p>
      </div>
      <div class="panel-acciones">
        <button type="button" id="btn-sonido" class="btn-icono" aria-pressed="true" title="Sonido de nuevos pedidos">Sonido: sí</button>
        <button type="button" id="btn-salir" class="btn-icono">Cerrar sesión</button>
      </div>
    </header>

    <div class="vistas" role="tablist" aria-label="Secciones del panel">
      <button type="button" role="tab" data-vista="pedidos" aria-selected="true" class="activo">Pedidos en curso</button>
      <button type="button" role="tab" data-vista="historial" aria-selected="false">Historial y ventas</button>
    </div>

    <section id="vista-historial" class="historial oculto" aria-label="Historial de ventas">
      <div class="hist-controles">
        <label>Mostrar
          <select id="hist-dias">
            <option value="7">últimos 7 días</option>
            <option value="30" selected>últimos 30 días</option>
            <option value="90">últimos 90 días</option>
            <option value="366">último año</option>
          </select>
        </label>
        <button type="button" id="btn-hist-recargar" class="btn-icono">Actualizar</button>
      </div>
      <div class="hist-kpis" id="hist-kpis"></div>
      <p class="hist-nota">Ventas = suma de los pedidos no cancelados, según el precio de cada pedido. Toca un día para ver sus pedidos.</p>
      <div id="hist-dias-lista" class="hist-dias"></div>
    </section>

    <div id="vista-pedidos">
    <nav class="filtros" id="filtros" aria-label="Filtrar pedidos">
      <button type="button" data-filtro="activos" class="activo">Activos <b id="cnt-activos">0</b></button>
      <button type="button" data-filtro="nuevo">Nuevos <b id="cnt-nuevo">0</b></button>
      <button type="button" data-filtro="preparando">Preparando <b id="cnt-preparando">0</b></button>
      <button type="button" data-filtro="listo">Listos <b id="cnt-listo">0</b></button>
      <button type="button" data-filtro="entregado">Entregados</button>
      <button type="button" data-filtro="cancelado">Cancelados</button>
      <button type="button" data-filtro="todos">Todos</button>
    </nav>

    <main id="lista-pedidos" class="lista-pedidos" aria-live="polite"></main>
    </div>
  </section>

  <!-- Revisión de un domicilio antes de aceptarlo -->
  <dialog id="dlg-revision" class="dlg" aria-labelledby="rev-titulo">
    <form id="form-revision" method="dialog" novalidate>
      <div class="dlg-cabecera">
        <h2 id="rev-titulo">Revisar domicilio</h2>
        <button type="button" class="dlg-cerrar" id="rev-cerrar" aria-label="Cerrar">×</button>
      </div>
      <p class="dlg-ayuda">Llama o escribe al cliente si algo no cuadra. Puedes corregir los datos antes de aceptar.</p>
      <div id="rev-resumen" class="rev-resumen"></div>
      <label><span>Nombre</span><input id="rev-nombre" maxlength="40" required></label>
      <label><span>Dirección</span><input id="rev-direccion" maxlength="80" required></label>
      <label><span>Celular</span><input id="rev-telefono" type="tel" inputmode="tel" maxlength="16" required></label>
      <div class="rev-contacto">
        <a id="rev-llamar" class="btn-contacto" href="#">Llamar</a>
        <a id="rev-whatsapp" class="btn-contacto wa" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a id="rev-mapa" class="btn-contacto mapa" href="#" target="_blank" rel="noopener noreferrer">Ver en el mapa</a>
      </div>
      <label class="rev-motivo"><span>Motivo si lo rechazas (lo verá el cliente)</span><input id="rev-motivo" maxlength="120" placeholder="Ej: Dirección fuera de nuestra zona"></label>
      <p id="rev-error" class="login-error" role="alert"></p>
      <div class="dlg-acciones">
        <button type="button" id="rev-rechazar" class="btn-cancelar">Rechazar</button>
        <button type="button" id="rev-guardar" class="btn-icono">Guardar sin aceptar</button>
        <button type="button" id="rev-aceptar" class="btn-primario">Aceptar domicilio</button>
      </div>
    </form>
  </dialog>

  <script src="js/draw.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
